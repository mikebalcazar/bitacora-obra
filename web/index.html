<html lang="es">

<body>
<div id="root"></div>

<!-- ── Pantalla de arranque ─────────────────────────────────────────────────
  La pidió Mike el 14-sep-2026: «un splash bonito tipo los de draw101 y
  nest101 para cuando está cargando quell». Misma idea que en draw101: una
  hoja —aquí el plano de una obra— flotando en perspectiva que se traza sola
  mientras la app arranca, y encima le van cayendo los puntos de la punchlist.

  Va en este archivo y no en React a propósito: se ve desde el primer byte,
  antes de que baje el JavaScript (en obra la señal es la que es), y trae su
  propio fondo, así que aunque no corra ni una línea de código nunca se ve la
  pantalla en blanco. La app lo quita con window.splash101.ocultar() cuando ya
  sabe quién entró (App.jsx), y puede cambiar el renglón con .estado("…").
  Si a los 8 s sigue ahí lo dice; a los 20 s ofrece «Reintentar».
──────────────────────────────────────────────────────────────────────────── -->
<div id="splash101" role="status" aria-live="polite">
  <div class="escena"><div class="plano">
    <svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect class="hoja" x="0" y="0" width="620" height="420" rx="3"/>
      <g class="rel"><path d="M60 0V420M120 0V420M180 0V420M240 0V420M300 0V420M360 0V420M420 0V420M480 0V420M540 0V420M0 60H620M0 120H620M0 180H620M0 240H620M0 300H620M0 360H620"/></g>
      <!-- muros: departamento con tres cuartos -->
      <path class="muro traza t1" d="M60 50H560V350H60Z"/>
      <path class="muro traza t1" d="M260 50V210M260 210H560M400 210V350"/>
      <!-- vanos -->
      <path class="fino traza t2" d="M150 350H210M150 350A60 60 0 0 1 210 290"/>
      <path class="fino traza t2" d="M260 120V170M260 170A50 50 0 0 1 310 120"/>
      <path class="fino traza t2" d="M480 210V260M480 260A50 50 0 0 0 430 210"/>
      <path class="fino traza t2" d="M320 46H440M320 54H440"/>
      <!-- muebles y equipos -->
      <path class="mueble traza t3" d="M66 56H200V120H66Z"/>
      <path class="fino traza t3" d="M110 56V120M156 56V120"/>
      <path class="mueble traza t3" d="M300 260H380V340H300Z"/>
      <path class="fino traza t3" d="M300 300H380"/>
      <path class="mueble traza t3" d="M440 60H550V150H440Z"/>
      <circle class="fino traza t3" cx="495" cy="105" r="18"/>
      <path class="mueble traza t3" d="M66 230H150V340H66Z"/>
      <path class="fino traza t3" d="M84 248H132V322H84Z"/>
      <!-- cotas -->
      <g class="aparece">
        <path class="cota" d="M60 380V394M560 380V394M60 388H560"/>
        <text class="num" x="310" y="404">9200</text>
        <path class="cota" d="M586 50H600M586 350H600M593 50V350"/>
        <text class="num" x="612" y="204" transform="rotate(90 612 204)">5400</text>
      </g>
      <!-- los puntos de la punchlist: caen uno por uno -->
      <g class="pin p1"><circle cx="180" cy="150" r="13"/><text x="180" y="154">1</text></g>
      <g class="pin p2"><circle cx="500" cy="180" r="13"/><text x="500" y="184">2</text></g>
      <g class="pin p3 ok"><circle cx="340" cy="300" r="13"/><text x="340" y="304">3</text></g>
      <g class="pin p4"><circle cx="110" cy="290" r="13"/><text x="110" y="294">4</text></g>
      <g class="pin p5 ok"><circle cx="440" cy="300" r="13"/><text x="440" y="304">5</text></g>
      <!-- rótulo -->
      <g class="aparece"><path class="fino" d="M470 362H612V412H470Z M470 380H612 M540 380V412"/>
        <text class="num" x="505" y="375" style="fill:#0381c2">OBRA · NIVEL 1</text>
        <text class="num" x="505" y="399" style="fill:#0381c2">PUNCHLIST</text>
        <text class="num" x="576" y="399" style="fill:#0381c2">A-01</text></g>
    </svg>
  </div></div>
  <div class="marca">
    <svg viewBox="126.33 208.74 402.42 194.51" height="44" role="img" aria-label="quell101" fill="#fff"><g transform="translate(0,351.34) scale(0.047783,-0.047783)"><path d="M3365.7648177959904 812.0Q3270.7648177959904 836.0 3190.7648177959904 836.0Q2905.7648177959904 836.0 2905.7648177959904 533.0Q2905.7648177959904 220.0 3152.7648177959904 220.0Q3276.7648177959904 220.0 3365.7648177959904 274.0ZM3630.7648177959904 -380.0H3365.7648177959904V50.0Q3257.7648177959904 0.0 3121.7648177959904 0.0Q2643.7648177959904 0.0 2643.7648177959904 531.0Q2643.7648177959904 1050.0 3188.7648177959904 1050.0Q3391.7648177959904 1050.0 3630.7648177959904 1007.0Z M4723.36481779599 1050.0V0.0H4516.36481779599L4484.36481779599 134.0Q4303.36481779599 0.0 4100.36481779599 0.0Q3778.3648177959903 0.0 3778.3648177959903 381.0V1050.0H4043.3648177959903V388.0Q4043.3648177959903 214.0 4195.36481779599 214.0Q4324.36481779599 214.0 4458.36481779599 317.0V1050.0Z M5313.96481779599 1050.0Q5791.96481779599 1050.0 5791.96481779599 562.0Q5791.96481779599 497.0 5782.96481779599 432.0H5085.96481779599Q5085.96481779599 210.0 5411.96481779599 210.0Q5570.96481779599 210.0 5729.96481779599 240.0V30.0Q5590.96481779599 0.0 5391.96481779599 0.0Q4820.96481779599 0.0 4820.96481779599 537.0Q4820.96481779599 1050.0 5313.96481779599 1050.0ZM5085.96481779599 616.0H5533.96481779599V624.0Q5533.96481779599 842.0 5313.96481779599 842.0Q5103.96481779599 842.0 5085.96481779599 616.0Z M6153.56481779599 1430.0V0.0H5888.56481779599V1430.0Z M6566.1648177959905 1430.0V0.0H6301.1648177959905V1430.0Z"/></g><rect x="126.33" y="360.72" width="26.49" height="6.52"/><rect x="366.4" y="261.5" width="16.27" height="89.61"/><rect x="479.98" y="261.19" width="16.27" height="89.61"/><path d="M431.49,208.74c-53.63,0-97.26,43.63-97.26,97.26,0,20.28,6.25,39.12,16.91,54.72h-169.64v6.52h174.51c17.85,21.95,45.05,36.01,75.48,36.01,53.63,0,97.26-43.63,97.26-97.26s-43.63-97.26-97.26-97.26ZM431.49,396.74c-29.48,0-55.72-14.14-72.3-35.99v-.02h-.01c-11.55-15.22-18.42-34.18-18.42-54.72,0-50.03,40.7-90.74,90.74-90.74s90.73,40.7,90.73,90.74-40.7,90.74-90.73,90.74Z"/><path d="M431.81,262.73c-26.11,0-39.16,14.87-39.16,44.62s13.05,44.38,39.16,44.38,38.48-14.79,38.48-44.38-12.83-44.62-38.48-44.62ZM431.81,337.61c-14.85,0-22.28-10.21-22.28-30.63s7.43-30.14,22.28-30.14,21.61,10.05,21.61,30.14-7.2,30.63-21.61,30.63Z"/></svg>
        <div class="estado" id="splash101-estado">Cargando aplicación <i></i><i></i><i></i></div>
    <button type="button" id="splash101-reintentar" hidden onclick="location.reload()">Reintentar</button>
  </div>
</div>
<style>
  #splash101{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#fff;
    background:#141C26;background-image:radial-gradient(circle at 20% 15%,rgba(63,95,133,.9) 0%,transparent 45%),
      radial-gradient(circle at 85% 85%,rgba(3,129,194,.55) 0%,transparent 45%),linear-gradient(160deg,#141C26 0%,#1C3557 55%,#24466F 100%);
    font-family:"Cifras","Raleway",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;transition:opacity .35s ease-out}
  #splash101.fuera{opacity:0;pointer-events:none}
  #splash101 .escena{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 38%}
  #splash101 .plano{position:absolute;left:50%;top:50%;width:620px;height:420px;margin:-210px 0 0 -310px;
    transform:rotateX(56deg) rotateZ(-16deg) translateY(28px) scale(.9);transform-style:preserve-3d;
    filter:drop-shadow(0 28px 24px rgba(0,0,0,.45)) drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:splash101-flotar 9s ease-in-out infinite}
  @keyframes splash101-flotar{0%,100%{transform:rotateX(56deg) rotateZ(-16deg) translateY(28px) scale(.9)}50%{transform:rotateX(54deg) rotateZ(-13deg) translateY(16px) scale(.9)}}
  @media (max-width:560px){#splash101 .plano{transform:rotateX(56deg) rotateZ(-16deg) translateY(70px) scale(.62)}
    @keyframes splash101-flotar{0%,100%{transform:rotateX(56deg) rotateZ(-16deg) translateY(70px) scale(.62)}50%{transform:rotateX(54deg) rotateZ(-13deg) translateY(58px) scale(.62)}}}
  #splash101 .plano svg{width:100%;height:100%;overflow:visible}
  #splash101 .hoja{fill:rgba(255,255,255,.92);stroke:rgba(255,255,255,.5);stroke-width:1}
  #splash101 .rel{fill:none;stroke:rgba(3,129,194,.14);stroke-width:.6}
  #splash101 .muro{fill:none;stroke:#141C26;stroke-width:5;stroke-linejoin:miter;opacity:.85}
  #splash101 .mueble{fill:none;stroke:#0381c2;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  #splash101 .fino{fill:none;stroke:#0381c2;stroke-width:.9;stroke-linecap:round}
  #splash101 .cota{fill:none;stroke:#7A8593;stroke-width:.9}
  #splash101 .num{font:9px "Cifras","Raleway",sans-serif;fill:#7A8593;text-anchor:middle}
  #splash101 .traza{stroke-dasharray:1400;stroke-dashoffset:1400;animation:splash101-trazar 1.1s ease-out forwards}
  #splash101 .t1{animation-delay:.05s}#splash101 .t2{animation-delay:.3s}#splash101 .t3{animation-delay:.55s}
  @keyframes splash101-trazar{to{stroke-dashoffset:0}}
  #splash101 .aparece{opacity:0;animation:splash101-aparecer .5s ease-out .9s forwards}
  @keyframes splash101-aparecer{to{opacity:1}}
  #splash101 .pin circle{fill:#D33A2F;stroke:#fff;stroke-width:2}
  #splash101 .pin.ok circle{fill:#2E8B57}
  #splash101 .pin text{font:700 11px "Cifras","Raleway",sans-serif;fill:#fff;text-anchor:middle}
  #splash101 .pin{opacity:0;transform-box:fill-box;transform-origin:center;animation:splash101-caer .45s cubic-bezier(.2,.9,.3,1.3) forwards}
  #splash101 .p1{animation-delay:.9s}#splash101 .p2{animation-delay:1s}#splash101 .p3{animation-delay:1.1s}#splash101 .p4{animation-delay:1.2s}#splash101 .p5{animation-delay:1.3s}
  @keyframes splash101-caer{from{opacity:0;transform:translateY(-18px) scale(.6)}to{opacity:1;transform:none}}
  /* sin halo: la sombra sigue el contorno del logotipo y del texto, corta y
     suave, sólo para despegarlos del plano (Mike, 14-sep: el halo parecía una mancha) */
  #splash101 .marca{position:relative;text-align:center;padding:36px 64px}
  /* la marca en el azul de la casa: contrasta con el plano blanco (Mike, 14-sep) */
  #splash101 .marca{color:#0381c2}
  #splash101 .marca svg{display:block;margin:0 auto 12px;height:44px;width:auto;fill:#0381c2;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(0 6px 8px rgba(0,40,70,.22))}
  #splash101 .sub,#splash101 .estado{text-shadow:0 1px 1px rgba(255,255,255,.7),0 3px 6px rgba(0,40,70,.18)}
  #splash101 .marca .estado i{background:#0381c2;box-shadow:0 1px 2px rgba(0,40,70,.3)}
  #splash101 .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
  /* sólo el logotipo (Mike, 14-sep): el estado se enseña únicamente si hay que avisar algo */
  #splash101 .estado{display:none;margin-top:14px;font-size:13px;min-height:18px;opacity:.95}
  #splash101.aviso .estado{display:block}
  #splash101 .estado i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin:0 2px;animation:splash101-latir 1.2s ease-in-out infinite}
  #splash101 .estado i:nth-child(2){animation-delay:.2s}#splash101 .estado i:nth-child(3){animation-delay:.4s}
  @keyframes splash101-latir{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  #splash101 button{margin-top:14px;padding:8px 22px;border:1px solid rgba(255,255,255,.6);border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font:600 13px "Raleway",system-ui,sans-serif;cursor:pointer}
  @media (prefers-reduced-motion:reduce){#splash101 .plano,#splash101 .traza,#splash101 .estado i,#splash101 .pin,#splash101 .aparece{animation:none}
    #splash101 .traza{stroke-dashoffset:0}#splash101 .pin,#splash101 .aparece{opacity:1}}
</style>
<script>
  (function () {
    var caja = document.getElementById("splash101"), linea = document.getElementById("splash101-estado"),
        boton = document.getElementById("splash101-reintentar"), desde = Date.now(), fuera = false;
    function estado(t) { if (fuera) return; linea.textContent = t + " ";
      for (var i = 0; i < 3; i++) linea.appendChild(document.createElement("i")); }
    function ocultar() { if (fuera) return; fuera = true;
      // que el plano alcance a trazarse y caigan los pines: mínimo 1,4 s en pantalla
      setTimeout(function () { caja.classList.add("fuera");
        setTimeout(function () { if (caja.parentNode) caja.parentNode.removeChild(caja); }, 400);
      }, Math.max(0, 1400 - (Date.now() - desde))); }
    setTimeout(function () { if (!fuera) { caja.classList.add("aviso"); estado("Sigue cargando… revisa tu señal"); } }, 8000);
    setTimeout(function () { if (!fuera) { caja.classList.add("aviso"); estado("No se pudo cargar"); boton.hidden = false; } }, 20000);
    window.splash101 = { estado: estado, ocultar: ocultar };
  })();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
