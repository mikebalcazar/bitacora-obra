# Arma la app de Android y la de Windows. No corre solo: se dispara a mano desde
# la pestaña Actions, porque armarlas tarda y casi nunca hace falta en cada
# cambio. Al terminar, los archivos quedan colgados de la corrida, en Artifacts.

name: Armar apps

on:
  workflow_dispatch:
    inputs:
      cual:
        description: 'Cuál armar'
        required: true
        default: android
        type: choice
        options: [android, windows, windows-nativo, piloto, todas]
      servidor:
        description: 'Dirección del servidor con el que van a hablar las apps'
        required: true
        default: 'https://bitacora-obra.mike-929.workers.dev'
      crear_llave:
        description: 'Android: crear la llave de firma (sólo la primera vez; si ya existe, no se toca)'
        required: false
        default: false
        type: boolean

jobs:
  android:
    name: Android (.apk)
    if: inputs.cual == 'android' || inputs.cual == 'todas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      # La app lleva el sitio adentro, así que la dirección del servidor se fija
      # aquí: dentro de la app las rutas relativas no llevan a ningún lado.
      # El número de esta corrida es la versión del .apk: la app lo lleva
      # adentro y lo compara con /descargas/android.json para avisar que hay
      # una nueva (web/src/VersionNueva.jsx).
      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
          VITE_VERSION_ANDROID: ${{ github.run_number }}
        run: npm run build

      - name: Preparar el proyecto de Android
        run: |
          set -e
          # `App` y `Browser` son los plugins con los que Google se abre encima
          # de la app y su vuelta llega a la app (web/src/nativo.js). Van con
          # --save (sólo en esta corrida): Capacitor encuentra los plugins por
          # el package.json. Todo en UNA instalación: un segundo `npm i --save`
          # borraría lo que se puso con --no-save.
          # `Filesystem` y `Share` (9-oct-2026): el PDF del reporte y las fotos
          # se comparten con la hoja de Android (web/src/compartir.js); el
          # navegador interno de Android no sabe compartir archivos.
          npm i --save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app@^7 @capacitor/browser@^7 @capacitor/filesystem@^7 @capacitor/share@^7
          npx cap add android
          # `cap add` rehace el proyecto en cada corrida, así que el ícono se
          # copia encima: si no, la app sale con el de Capacitor.
          cp -r apps/android/res/. android/app/src/main/res/
          python3 apps/android/ligas.py
          # La versión que Android compara para instalar encima: siempre crece.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          npx cap sync android
          grep -q '@capacitor/app' android/capacitor.settings.gradle
          grep -q '@capacitor/browser' android/capacitor.settings.gradle
          grep -q '@capacitor/filesystem' android/capacitor.settings.gradle
          grep -q '@capacitor/share' android/capacitor.settings.gradle
          # La hoja de compartir lee el archivo de la caché por el FileProvider
          # que trae la plantilla de Capacitor: si algún día no lo trae, que
          # no se arme una app que comparte en silencio nada.
          grep -q 'cache-path' android/app/src/main/res/xml/file_paths.xml

      # La llave de firma es SIEMPRE la misma (Mike, 9-oct-2026): con una llave
      # distinta en cada corrida, Android se niega a instalar la versión nueva
      # encima de la vieja y hay que desinstalar, con riesgo de perder lo que no
      # se ha subido. Vive en el bucket privado `quell101-llaves`, al que no está
      # atado ningún Worker: no hay dirección por la que se pueda bajar.
      #
      # Tiene la forma de una llave de depuración (`~/.android/debug.keystore`,
      # alias `androiddebugkey`, clave `android`) y con ella se firma el .apk a
      # mano después de armarlo, así que el proyecto que rehace `cap add` no se
      # toca. Lo secreto es el archivo, no la clave.
      #
      # Sólo se CREA si se pide (`crear_llave`) y si R2 contesta que no existe.
      # Cualquier otra falla al leerla tumba el armado: generar una llave nueva
      # por un tropiezo de red rompería las actualizaciones de todos.
      - name: La llave de firma de siempre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CREAR: ${{ inputs.crear_llave }}
        run: |
          set -e
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if npx wrangler r2 object get quell101-llaves/android/firma.keystore \
               --file="$HOME/.android/debug.keystore" --remote > "$RUNNER_TEMP/llave.log" 2>&1; then
            echo "Se usa la llave guardada."
          elif grep -qiE 'does not exist|NoSuchKey|not found' "$RUNNER_TEMP/llave.log"; then
            if [ "$CREAR" != "true" ]; then
              echo "::error::No hay llave de firma en quell101-llaves/android/firma.keystore. Correr una vez con crear_llave."
              exit 1
            fi
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=quell101, O=FORESPOT, C=MX"
            npx wrangler r2 object put quell101-llaves/android/firma.keystore \
              --file="$HOME/.android/debug.keystore" --remote
            echo "Llave nueva creada y guardada."
          else
            cat "$RUNNER_TEMP/llave.log"
            echo "::error::No se pudo leer la llave de firma; no se arma con otra."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/llave.log"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'

      - name: Armar el .apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Gradle no siempre toma `~/.android/debug.keystore` (el 9-oct firmó con
      # otra llave del corredor), así que el .apk se FIRMA aquí, a mano, con la
      # llave de siempre, y luego se revisa que la huella sea la de esa llave.
      - name: Firmar con la llave de siempre y revisar
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          HERR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$HERR/apksigner" sign --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/firmada.apk" "$APK"
          mv "$RUNNER_TEMP/firmada.apk" "$APK"
          "$HERR/apksigner" verify --print-certs "$APK" | grep -v '^WARNING' | tee "$RUNNER_TEMP/firma.txt"
          APK_SHA=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/firma.txt" | awk '{print $NF}')
          LLAVE_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk: $APK_SHA"; echo "llave: $LLAVE_SHA"
          [ -n "$APK_SHA" ] && [ "$APK_SHA" = "$LLAVE_SHA" ] || { echo "::error::El .apk no salió firmado con la llave de siempre"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-obra-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Y se deja donde el propio sitio la pueda entregar: quien va a instalarla
      # todavía no tiene sesión —muchas veces es alguien de obra al que le
      # pasaron la liga— y bajarla de aquí exigiría cuenta de GitHub.
      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          npx wrangler r2 object put bitacora-obra-files/apps/android.apk \
            --file="$APK" --content-type=application/vnd.android.package-archive --remote
          # Y DESPUÉS su número: si se subiera antes, una app avisaría de una
          # versión que todavía no se puede bajar.
          printf '{"version":%s,"fecha":"%s"}' "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/android.json"
          npx wrangler r2 object put bitacora-obra-files/apps/android.json \
            --file="$RUNNER_TEMP/android.json" --content-type=application/json --remote

  windows:
    name: Windows (instalador)
    if: inputs.cual == 'windows' || inputs.cual == 'todas'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
        run: npm run build

      - name: Meter la aplicación dentro del envoltorio
        run: |
          New-Item -ItemType Directory -Force -Path apps/windows/dist | Out-Null
          Copy-Item -Recurse -Force web/dist/* apps/windows/dist/
          if (-not (Test-Path apps/windows/build/icon.ico)) { throw "Falta el icono: el instalador saldria con el de Electron." }
        shell: pwsh

      - name: Armar el instalador
        working-directory: apps/windows
        run: |
          npm install --no-package-lock
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-obra-windows
          path: apps/windows/salida/*.exe
          if-no-files-found: error

      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem apps/windows/salida/*.exe | Select-Object -First 1).FullName
          npx wrangler r2 object put bitacora-obra-files/apps/windows.exe --file="$exe" --content-type=application/vnd.microsoft.portable-executable --remote

  windows-nativo:
    name: Windows nativo (C++)
    if: inputs.cual == 'windows-nativo' || inputs.cual == 'todas'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
        run: npm run build

      # El WebView de Windows no se empaqueta: ya viene con el sistema. Lo único
      # que hace falta para compilar son sus encabezados.
      - name: Traer los encabezados del WebView
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory paquetes -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory paquetes -ExcludeVersion

      - name: Meter la aplicación web dentro del ejecutable
        shell: pwsh
        run: |
          Copy-Item apps/windows/build/icon.ico apps/windows-cpp/gen-icono.ico -Force
          python apps/windows-cpp/generar_recursos.py web/dist apps/windows-cpp/gen
          Copy-Item apps/windows/build/icon.ico apps/windows-cpp/gen/icono.ico -Force
          Copy-Item apps/windows-cpp/recursos.h apps/windows-cpp/gen/recursos.h -Force

      - name: Compilar
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set WV2=%CD%\paquetes\Microsoft.Web.WebView2\build\native
          set WIL=%CD%\paquetes\Microsoft.Windows.ImplementationLibrary\include
          rc /nologo /fo apps\windows-cpp\gen\recursos.res /i apps\windows-cpp\gen apps\windows-cpp\gen\recursos.rc
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE ^
             /I "%WV2%\include" /I "%WIL%" /I apps\windows-cpp\gen /I apps\windows-cpp ^
             apps\windows-cpp\main.cpp apps\windows-cpp\gen\recursos.res ^
             /Fe:quell101-nativo.exe ^
             /link /SUBSYSTEM:WINDOWS "%WV2%\x64\WebView2LoaderStatic.lib" ^
             user32.lib gdi32.lib ole32.lib oleaut32.lib shlwapi.lib shell32.lib advapi32.lib version.lib

      - name: Cuánto pesa
        shell: pwsh
        run: |
          $exe = Get-Item quell101-nativo.exe
          "### Windows nativo: {0:N1} MB" -f ($exe.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: quell101-windows-nativo
          path: quell101-nativo.exe
          if-no-files-found: error

      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          npx wrangler r2 object put bitacora-obra-files/apps/windows-nativo.exe --file=quell101-nativo.exe --content-type=application/vnd.microsoft.portable-executable --remote

  windows-piloto:
    name: Windows piloto nativo (C++ puro)
    if: inputs.cual == 'piloto' || inputs.cual == 'todas'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # El piloto es el único que NO lleva el sitio adentro: tiene su propia
      # pantalla de entrada en C++, y desde el 16-sep esa entrada no existe
      # —`/api/auth/pin` contesta 410—. Armarlo y publicarlo dejaría en la
      # página de descargas un programa que no abre.
      #
      # El candado se limpia solo: en cuanto `main.cpp` deje de llamar a esa
      # ruta y pida la sesión a la suite (contrato 0.8.0, `aparato: true`), este
      # paso pasa sin que nadie tenga que acordarse de quitarlo.
      - name: Revisar que el piloto pueda entrar
        shell: pwsh
        run: |
          if (Select-String -Path apps/windows-nativo/main.cpp -Pattern '/api/auth/pin' -Quiet) {
            throw "El piloto sigue entrando por /api/auth/pin, y esa puerta se cerró el 16-sep (contesta 410). Tal como está, el programa no puede entrar: arreglar main.cpp para pedir la sesión a la suite con aparato:true antes de armarlo. Está anotado en ese mismo archivo."
          }

      # PDFium es el que dibuja el plano. Son las mismas entrañas que usa Chrome
      # para ver PDFs, sueltas: no hace falta navegador para tenerlas.
      - name: Traer PDFium
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force -Path pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          Get-ChildItem -Recurse pdfium -Include *.lib,*.dll | Select-Object FullName

      - name: Compilar
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          copy apps\windows\build\icon.ico apps\windows-nativo\icono.ico
          rc /nologo /fo apps\windows-nativo\recursos.res /i apps\windows-nativo apps\windows-nativo\recursos.rc
          cl /nologo /std:c++17 /EHsc /O2 /MD /utf-8 /DUNICODE /D_UNICODE ^
             /I pdfium\include /I apps\windows-nativo ^
             apps\windows-nativo\main.cpp apps\windows-nativo\red.cpp apps\windows-nativo\json.cpp apps\windows-nativo\plano.cpp ^
             apps\windows-nativo\recursos.res ^
             /Fe:quell101-piloto.exe ^
             /link /SUBSYSTEM:WINDOWS pdfium\lib\pdfium.dll.lib ^
             user32.lib gdi32.lib winhttp.lib psapi.lib shell32.lib

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path piloto | Out-Null
          Copy-Item quell101-piloto.exe piloto/
          Copy-Item (Get-ChildItem -Recurse pdfium -Filter pdfium.dll | Select-Object -First 1).FullName piloto/
          $exe = Get-Item quell101-piloto.exe
          $dll = Get-Item piloto/pdfium.dll
          "### Piloto nativo" >> $env:GITHUB_STEP_SUMMARY
          "- Programa: {0:N2} MB" -f ($exe.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          "- PDFium: {0:N1} MB" -f ($dll.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          Compress-Archive -Path piloto/* -DestinationPath quell101-piloto.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: quell101-piloto-nativo
          path: quell101-piloto.zip
          if-no-files-found: error

      - name: Publicar el piloto en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          npx wrangler r2 object put bitacora-obra-files/apps/piloto.zip --file=quell101-piloto.zip --content-type=application/zip --remote

  # Mike, 17-sep-2026: en GitHub sólo se quedan los 3 artefactos más recientes
  # de cada familia; los demás se borran aquí, al final de cada corrida, pase
  # lo que pase con las armadas. Lo que cuenta ya está en R2 (la página lo
  # entrega); el artefacto es sólo el respaldo del run, y 6 GB de respaldos
  # fueron parte de lo que agotó el plan de Actions en septiembre.
  podar:
    name: Podar artefactos viejos
    needs: [android, windows, windows-nativo, windows-piloto]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dejar sólo los 3 más recientes por familia
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILIAS: bitacora-obra-android bitacora-obra-windows quell101-windows-nativo quell101-piloto-nativo
        run: |
          set -euo pipefail
          for FAMILIA in $FAMILIAS; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired|not) | [.created_at, .id, .name] | @tsv' \
            | awk -F'\t' -v f="$FAMILIA" 'index($3,f)==1' \
            | sort -r | tail -n +4 \
            | while IFS=$'\t' read -r fecha id nombre; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
                echo "borrado $nombre ($fecha)"
              done
            echo "familia $FAMILIA: quedan a lo más 3 artefactos"
          done
