# Arma la app de Android y la de Windows. No corre solo: se dispara a mano desde
# la pestaña Actions, porque armarlas tarda y casi nunca hace falta en cada
# cambio. Al terminar, los archivos quedan colgados de la corrida, en Artifacts.

name: Armar apps

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: 'Dirección del servidor con el que van a hablar las apps'
        required: true
        default: 'https://bitacora-obra.mike-929.workers.dev'

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      # La app lleva el sitio adentro, así que la dirección del servidor se fija
      # aquí: dentro de la app las rutas relativas no llevan a ningún lado.
      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
        run: npm run build

      - name: Preparar el proyecto de Android
        run: |
          set -e
          npm i --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android

      - name: Armar el .apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-obra-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Y se deja donde el propio sitio la pueda entregar: quien va a instalarla
      # todavía no tiene sesión —muchas veces es alguien de obra al que le
      # pasaron la liga— y bajarla de aquí exigiría cuenta de GitHub.
      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          npx wrangler r2 object put bitacora-obra-files/apps/android.apk \
            --file="$APK" --content-type=application/vnd.android.package-archive --remote

  windows:
    name: Windows (instalador)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
        run: npm run build

      - name: Meter la aplicación dentro del envoltorio
        run: |
          New-Item -ItemType Directory -Force -Path apps/windows/dist | Out-Null
          Copy-Item -Recurse -Force web/dist/* apps/windows/dist/
          if (-not (Test-Path apps/windows/build/icon.ico)) { throw "Falta el icono: el instalador saldria con el de Electron." }
        shell: pwsh

      - name: Armar el instalador
        working-directory: apps/windows
        run: |
          npm install --no-package-lock
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-obra-windows
          path: apps/windows/salida/*.exe
          if-no-files-found: error

      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem apps/windows/salida/*.exe | Select-Object -First 1).FullName
          npx wrangler r2 object put bitacora-obra-files/apps/windows.exe --file="$exe" --content-type=application/vnd.microsoft.portable-executable --remote

  windows-nativo:
    name: Windows nativo (C++)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      - name: Armar la aplicación
        env:
          VITE_API_BASE: ${{ inputs.servidor }}
        run: npm run build

      # El WebView de Windows no se empaqueta: ya viene con el sistema. Lo único
      # que hace falta para compilar son sus encabezados.
      - name: Traer los encabezados del WebView
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory paquetes -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory paquetes -ExcludeVersion

      - name: Meter la aplicación web dentro del ejecutable
        shell: pwsh
        run: |
          Copy-Item apps/windows/build/icon.ico apps/windows-cpp/gen-icono.ico -Force
          python apps/windows-cpp/generar_recursos.py web/dist apps/windows-cpp/gen
          Copy-Item apps/windows/build/icon.ico apps/windows-cpp/gen/icono.ico -Force
          Copy-Item apps/windows-cpp/recursos.h apps/windows-cpp/gen/recursos.h -Force

      - name: Compilar
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          set WV2=%CD%\paquetes\Microsoft.Web.WebView2\build\native
          set WIL=%CD%\paquetes\Microsoft.Windows.ImplementationLibrary\include
          rc /nologo /fo apps\windows-cpp\gen\recursos.res /i apps\windows-cpp\gen apps\windows-cpp\gen\recursos.rc
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE ^
             /I "%WV2%\include" /I "%WIL%" /I apps\windows-cpp\gen /I apps\windows-cpp ^
             apps\windows-cpp\main.cpp apps\windows-cpp\gen\recursos.res ^
             /Fe:quell101-nativo.exe ^
             /link /SUBSYSTEM:WINDOWS "%WV2%\x64\WebView2LoaderStatic.lib" ^
             user32.lib gdi32.lib ole32.lib oleaut32.lib shlwapi.lib shell32.lib advapi32.lib version.lib

      - name: Cuánto pesa
        shell: pwsh
        run: |
          $exe = Get-Item quell101-nativo.exe
          "### Windows nativo: {0:N1} MB" -f ($exe.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: quell101-windows-nativo
          path: quell101-nativo.exe
          if-no-files-found: error

      - name: Publicar la app en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          npx wrangler r2 object put bitacora-obra-files/apps/windows-nativo.exe --file=quell101-nativo.exe --content-type=application/vnd.microsoft.portable-executable --remote

  windows-piloto:
    name: Windows piloto nativo (C++ puro)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # PDFium es el que dibuja el plano. Son las mismas entrañas que usa Chrome
      # para ver PDFs, sueltas: no hace falta navegador para tenerlas.
      - name: Traer PDFium
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force -Path pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          Get-ChildItem -Recurse pdfium -Include *.lib,*.dll | Select-Object FullName

      - name: Compilar
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          copy apps\windows\build\icon.ico apps\windows-nativo\icono.ico
          rc /nologo /fo apps\windows-nativo\recursos.res /i apps\windows-nativo apps\windows-nativo\recursos.rc
          cl /nologo /std:c++17 /EHsc /O2 /MD /utf-8 /DUNICODE /D_UNICODE ^
             /I pdfium\include /I apps\windows-nativo ^
             apps\windows-nativo\main.cpp apps\windows-nativo\red.cpp apps\windows-nativo\json.cpp apps\windows-nativo\plano.cpp ^
             apps\windows-nativo\recursos.res ^
             /Fe:quell101-piloto.exe ^
             /link /SUBSYSTEM:WINDOWS pdfium\lib\pdfium.dll.lib ^
             user32.lib gdi32.lib winhttp.lib psapi.lib shell32.lib

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path piloto | Out-Null
          Copy-Item quell101-piloto.exe piloto/
          Copy-Item (Get-ChildItem -Recurse pdfium -Filter pdfium.dll | Select-Object -First 1).FullName piloto/
          $exe = Get-Item quell101-piloto.exe
          $dll = Get-Item piloto/pdfium.dll
          "### Piloto nativo" >> $env:GITHUB_STEP_SUMMARY
          "- Programa: {0:N2} MB" -f ($exe.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          "- PDFium: {0:N1} MB" -f ($dll.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          Compress-Archive -Path piloto/* -DestinationPath quell101-piloto.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: quell101-piloto-nativo
          path: quell101-piloto.zip
          if-no-files-found: error

      - name: Publicar el piloto en la página
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          npx wrangler r2 object put bitacora-obra-files/apps/piloto.zip --file=quell101-piloto.zip --content-type=application/zip --remote
