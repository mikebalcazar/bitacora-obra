# Publica la Bitácora de Obra en Cloudflare cada vez que cambia el código.
# No hace falta ninguna computadora: GitHub la despliega solo.
#
# Requisitos (una sola vez, en Settings → Secrets and variables → Actions).
# Son los mismos nombres que ya usa el portal de Taller 101, así que los
# valores se copian tal cual de allá:
#   CLOUDFLARE_API_TOKEN   token con Workers Scripts:Edit, Workers R2 Storage:Edit,
#                          D1:Edit, Account Settings:Read, User Details:Read
#   RESEND_API_KEY         llave de envío de correos (opcional: sin ella no salen
#                          los códigos de acceso, pero el resto funciona)
#
# La cuenta de Cloudflare no se pide aparte: el token ya dice a qué cuenta
# pertenece y wrangler la resuelve solo.

name: Publicar bitácora

on:
  push:
    branches: [main]
    # Un cambio de documentación no republica: el 11 y el 12-sep, tocar
    # OPERAR.md disparó tres despliegues que nadie pidió. Aquí ningún `.md`
    # es contenido publicado —se comprobó: sólo README y OPERAR—, así que se
    # ignoran todos. El botón de abajo sigue sirviendo para publicar a mano.
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:        # botón para publicar a mano desde la web de GitHub

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      # La puerta, en una mesa de trabajo: con una API de mentiras y tres
      # renglones de base se comprueba quién pasa y —sobre todo— quién no.
      # Corre antes de publicar: un despliegue no enseña esto hasta que ya es
      # tarde.
      - name: Probar la puerta
        run: npm run prueba

      - name: Armar la aplicación
        run: npm run build

      # La base y el almacén de fotos se crean solos la primera vez. De la
      # segunda en adelante ya existen y este paso nada más los encuentra.
      - name: Preparar base de datos y almacén de archivos
        run: |
          set -e
          npx wrangler d1 create bitacora-obra 2>/dev/null || echo "La base ya existía."
          npx wrangler r2 bucket create bitacora-obra-files 2>/dev/null || echo "El almacén ya existía."
          D1_ID=$(npx wrangler d1 list --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const fila = JSON.parse(s.slice(s.indexOf("["))).find((d) => d.name === "bitacora-obra");
              if (!fila) { console.error("No apareció la base bitacora-obra."); process.exit(1); }
              console.log(fila.uuid || fila.id);
            });
          ')
          if [ -z "$D1_ID" ]; then echo "No pude resolver el identificador de la base."; exit 1; fi
          sed -i "s/__D1_ID__/$D1_ID/" wrangler.toml
          echo "Base: $D1_ID"

      - name: Aplicar las migraciones
        run: npx wrangler d1 migrations apply bitacora-obra --remote

      - name: Publicar
        run: npx wrangler deploy

      # El secreto se vuelve a mandar en cada despliegue: así el estado del
      # Worker siempre coincide con lo que está guardado en GitHub, y si alguien
      # rota la llave basta cambiar el secreto y volver a publicar.
      - name: Actualizar secretos del Worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -e
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "Sin RESEND_API_KEY: los códigos de acceso NO se envían por correo."
          fi

      # La puerta de la suite, medida desde afuera: que el enlace de servicio
      # llegue a la API, que nada abra sin sesión y que la puerta vieja siga en
      # pie para las apps ya instaladas. Aquí NO se entra y NO se escribe:
      # quell101 no tiene staging y su base es la obra de verdad.
      - name: Medir la puerta de la suite
        id: medir
        continue-on-error: true
        run: |
          set -o pipefail
          sleep 12
          node scripts/medir.mjs 2>&1 | tee /tmp/medicion.txt

      - name: Dejar la medición en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          [ -f /tmp/medicion.txt ] || echo "No hubo medición que reportar." > /tmp/medicion.txt
          jq -Rs '{body: ("**Medicion de la puerta**\n\n```\n" + .[-60000:] + "\n```")}' \
            /tmp/medicion.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /dev/null -w 'comentario: %{http_code}\n'

      - name: La medición tenía que salir verde
        if: steps.medir.outcome == 'failure'
        run: exit 1

      - name: Revisar que la bitácora responda
        run: |
          set -e
          DIR=$(npx wrangler deployments list 2>/dev/null | grep -oE 'https://[a-z0-9.-]+workers\.dev' | head -1 || true)
          if [ -z "$DIR" ]; then echo "No pude leer la dirección; búscala en dash.cloudflare.com → Workers."; exit 0; fi
          sleep 12
          curl -fsS "$DIR/api/salud"
          echo ""
          echo "### Publicado en $DIR" >> "$GITHUB_STEP_SUMMARY"

  # El chat no alcanza producción; el corredor sí. Este trabajo le pega a la
  # dirección real y deja los números en el log, que es lo que el chat lee.
  verificar:
    needs: publicar
    uses: ./.github/workflows/verificar.yml
    with:
      url: https://bitacora-obra.mike-929.workers.dev
      marca: quell101
      # Las cinco fuentes, una por una. Que la portada responda no dice nada de
      # ellas: si una .woff2 se cae, la app sigue abriendo y solo se ve con otra
      # letra -- que es justo el fallo silencioso que se quiso quitar de encima.
      rutas: >-
        /api/salud
        /fonts/fira-cifras-400.woff2
        /fonts/fira-cifras-600.woff2
        /fonts/raleway-400.woff2
        /fonts/raleway-600.woff2
        /fonts/raleway-700.woff2
      # Y que además se estén APLICANDO, no solo respondiendo.
      cifras: Cifras, Raleway, sans-serif
