name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependencias
        run: npm ci && npm --prefix web ci

      - name: Build frontend
        run: npm run build

      - name: Asegurar recursos Cloudflare (D1 + R2)
        id: res
        run: |
          set -e
          # D1: crear si no existe y resolver database_id
          if ! npx wrangler d1 list --json | grep -q '"name": *"bitacora-obra"'; then
            npx wrangler d1 create bitacora-obra
          fi
          D1_ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const x=j.find(d=>d.name==="bitacora-obra");console.log(x.uuid)})')
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"
          sed -i "s/__D1_ID__/$D1_ID/" wrangler.toml
          # R2: crear si no existe
          npx wrangler r2 bucket create bitacora-obra-files 2>/dev/null || true

      - name: Migraciones D1
        run: npx wrangler d1 migrations apply bitacora-obra --remote

      - name: Secrets del Worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; else echo "sin RESEND_API_KEY (modo sin correo)"; fi

      - name: Deploy Worker + assets
        run: npx wrangler deploy

      - name: URL
        run: |
          echo "### Publicado" >> $GITHUB_STEP_SUMMARY
          npx wrangler deployments list 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || true
