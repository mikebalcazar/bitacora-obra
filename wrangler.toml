name = "bitacora-obra"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Qué atiende el Worker antes que los archivos del sitio. Lo que no esté aquí lo
# resuelve la capa de archivos, y como esta aplicación vive en una sola página,
# lo que no encuentra devuelve index.html: por eso una ruta olvidada aquí no da
# "no encontrado", sino la pantalla de entrada, que despista.
run_worker_first = ["/api/*", "/files/*", "/descargas/*"]

[vars]
APP_NAME = "t101pano"
MAIL_FROM = "t101pano <bitacora@envios.taller101.mx>"
DEV = ""

[[d1_databases]]
binding = "DB"
database_name = "bitacora-obra"
database_id = "__D1_ID__"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bitacora-obra-files"
