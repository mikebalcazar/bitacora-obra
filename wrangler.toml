name = "bitacora-obra"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Desde el 25-sep-2026 quell101 vive también en quell101.taller101.com (el
# dominio lleva el nombre de la app, no el del Worker): el DNS de taller101.com
# está en Cloudflare y el Worker se cuelga del dominio como *custom domain*;
# Cloudflare pone el registro y el certificado. `workers_dev = true` es
# obligatorio al lado de `routes`: sin él wrangler apaga workers.dev (le pasó
# a peek101). Las dos direcciones se quedan.
workers_dev = true
routes = [
  { pattern = "quell101.taller101.com", custom_domain = true }
]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Qué atiende el Worker antes que los archivos del sitio. Lo que no esté aquí lo
# resuelve la capa de archivos, y como esta aplicación vive en una sola página,
# lo que no encuentra devuelve index.html: por eso una ruta olvidada aquí no da
# "no encontrado", sino la pantalla de entrada, que despista.
run_worker_first = ["/api/*", "/files/*", "/descargas/*", "/s101/*"]

[vars]
APP_NAME = "quell101"
# La dirección de workers.dev manda al dominio (Mike, 25-sep: «redirigir, no
# apagar»). Sólo producción: staging tiene sus propias `vars` y no lleva esto.
DOMINIO_PROPIO = "quell101.taller101.com"
# La empresa de la suite de este sitio. Desde el 19-sep quell101 no tiene base:
# sus datos viven en la base por empresa de la suite, y esta es la empresa que
# se abre por omisión a quien es miembro de varias (y al dueño de la suite).
ORG_ID = "forespot"

# DESDE EL 19-SEP-2026 AQUÍ NO HAY D1. La base `bitacora-obra` se quedó en
# Cloudflare, sin tocar, como red de seguridad de la mudanza; se borra cuando
# lleve unos días de más. Sus datos están en la base por empresa de la suite.

# El bucket se queda sólo para los instaladores (apps/*): los planos y las
# fotos viven en el bucket de la suite, bajo orgs/{empresa}/quell/.
[[r2_buckets]]
binding = "FILES"
bucket_name = "bitacora-obra-files"

# La puerta de la suite, desde el mismo origen. No hay URL: es un *service
# binding*, o sea una llamada de Worker a Worker que nunca sale a internet.
# Todo `/s101/*`, `/api/*` y `/files/*` va a dar ahí con `X-App: quell101`.
[[services]]
binding = "API"
service = "suite101-api"

# ─────────────── staging ───────────────
# Mismo código, contra la API de staging y la empresa `demo`. Es lo que
# quell101 no tenía: un lugar donde entrar y escribir sin tocar la obra real.
[env.staging]
name = "bitacora-obra-staging"
# `routes` se hereda del nivel de arriba; staging NO se cuelga del dominio.
routes = []

[env.staging.assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*", "/descargas/*", "/s101/*"]

[env.staging.vars]
APP_NAME = "quell101"
ORG_ID = "demo"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "bitacora-obra-files"

[[env.staging.services]]
binding = "API"
service = "suite101-api-staging"
